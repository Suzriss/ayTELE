name: Build and Release Tweak

permissions:
    contents: write

on:
    release:
        types: [published]

jobs:
    cleanup:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7

            - name: Cleaning up existing releases and tags
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release delete release --yes || true
                git push origin :refs/tags/release || true

    build:
        needs: cleanup
        runs-on: macos-15
        strategy:
            matrix:
                scheme: [rootful, rootless, roothide]
                include:
                  - scheme: rootful
                    scheme_arg: ""
                  - scheme: rootless
                    scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
                  - scheme: roothide
                    scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.repository.default_branch }}

            - name: Set up Theos
              uses: waruhachi/theos-action@v2.4.6
              with:
                theos-src: 'waruhachi/theos'
                theos-branch: 'main'
                sdks-src: 'waruhachi/sdks'
                sdks-branch: 'main'

            - name: Build Package
              shell: bash
              run: |
                make clean package FINALPACKAGE=1 STRIP=0 ${{ matrix.scheme_arg }}

            - name: Upload DEB
              uses: actions/upload-artifact@v7
              with:
                name: ${{ matrix.scheme }}-package
                path: packages/*.deb

    release:
        needs: build
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.repository.default_branch }}

            - name: Download all DEBs
              uses: actions/download-artifact@v8
              with:
                path: packages
                merge-multiple: true

            - name: Extract ayTELE.dylib for sideloading
              shell: bash
              run: |
                set -e
                mkdir -p deb-extract
                (cd deb-extract && ar x ../packages/*_iphoneos-arm.deb && tar -xf data.tar.*)
                cp "$(find deb-extract -name '*.dylib' | head -n1)" packages/ayTELE.dylib
                rm -rf deb-extract

            - name: Generate Checksums
              id: metadata
              shell: bash
              run: |
                for pkg in packages/*_iphoneos-arm.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootful (iphoneos-arm)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootless (iphoneos-arm64)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64e.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### RootHide (iphoneos-arm64e)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: release
                name: ayTELE
                body_path: release_body.md
                files: |
                  packages/*.deb
                  packages/ayTELE.dylib
                draft: false
                prerelease: false
                make_latest: true

            - name: Delete build artifacts
              uses: geekyeggo/delete-artifact@v6
              with:
                name: |
                  rootful-package
                  rootless-package
                  roothide-package
                failOnError: false
