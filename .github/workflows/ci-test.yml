name: CI test
on:
  push:
    branches: [ci-test]
jobs:
  filter-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Embedded strings up to date
        run: python3 ci/gen_strings.py --check
      - name: Embedded TL schema up to date
        run: python3 ci/gen_tl.py --check
      - name: Run filter tests
        run: |
          swiftc -O -o filtertest Sources/tgapi/api_sources/*.swift Sources/tgapi/DeletedMessages.swift Sources/tgapi/EditHistory.swift Sources/tgapi/MessageDetails.swift Sources/tgapi/Notes.swift Sources/tgapi/DeletedArchive.swift Sources/tgapi/Protected.swift Sources/tgapi/Receipts.swift Sources/tgapi/TLSchemaData.swift Sources/tgapi/TLWalker.swift ci/main.swift
          ./filtertest
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'
      - name: Build Package
        run: |
          make clean package FINALPACKAGE=1 STRIP=0 THEOS_PACKAGE_SCHEME=rootless
          # The rootful dylib is what sideloaded (non-jailbroken) apps inject.
          # The toolchain's default scheme is NOT rootful here — it links
          # libroothide and calls jbroot(), which crashes a sideloaded app at
          # launch (Library not loaded: @loader_path/.jbroot/usr/lib/libroothide.dylib).
          # So force the rootful scheme explicitly.
          make clean package FINALPACKAGE=1 STRIP=0 THEOS_PACKAGE_SCHEME=rootful
      - name: Export rootful dylib (for sideload injection)
        run: |
          # The rootful build is the last one above, so .theos/obj holds it.
          mkdir -p out-dylib
          DYLIB_PATH=$(find .theos/obj -name '*.dylib' | head -n1)
          echo "Using dylib: $DYLIB_PATH"
          cp "$DYLIB_PATH" out-dylib/ayTELE.dylib
          echo "=== checking for libroothide/jbroot linkage (must be none) ==="
          if otool -l out-dylib/ayTELE.dylib | grep -iE "libroot|roothide|jbroot"; then
            echo "ERROR: dylib still depends on roothide — it will crash a sideloaded app at launch." >&2
            exit 1
          fi
          echo "none (good)"
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: aytele-dylib
          path: out-dylib/ayTELE.dylib
